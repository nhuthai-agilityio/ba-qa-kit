name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Marketplace and every plugin pass claude plugin validate
        run: |
          claude plugin validate . --strict
          for p in plugins/*/; do claude plugin validate "$p" --strict; done
      - name: The guard rules setup writes are valid settings JSON
        run: jq -e '.permissions.deny | length > 0' plugins/ba-qa-kit/templates/settings-guard.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go install github.com/agent-ecosystem/skill-validator/cmd/skill-validator@latest
      - name: Every skill passes skill-validator and the kit rules
        run: |
          status=0
          for s in $(find plugins -path '*/skills/*/SKILL.md' -exec dirname {} \;); do
            f="$s/SKILL.md"
            # typed-only skills carry Claude Code fields outside the spec, and their description is menu text
            typed=; grep -q '^disable-model-invocation: true' "$f" && typed=--allow-extra-frontmatter
            "$(go env GOPATH)/bin/skill-validator" check "$s" --strict $typed -o compact || status=1
            if [ -z "$typed" ] && ! sed -n 's/^description: *//p' "$f" | grep -q 'Use when'; then
              echo "::error file=$f::description must say when to use the skill: \"<what it does>. Use when ...\""; status=1
            fi
            if [ "$(wc -l < "$f")" -gt 200 ]; then
              echo "::error file=$f::SKILL.md is over 200 lines; move detail into a separate file"; status=1
            fi
          done
          exit $status

  # The kit's hooks run on the team's machines: Ubuntu (dash, mawk) and Windows (Git Bash, gawk).
  hook-test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: url-guard and secret-guard block what they must and let the rest through
        run: |
          shells="sh bash"; [ "$RUNNER_OS" = Linux ] && shells="$shells dash"   # Claude Code on Windows runs hooks in Git Bash
          sh plugins/ba-qa-kit/hooks/hooks.test.sh $shells
